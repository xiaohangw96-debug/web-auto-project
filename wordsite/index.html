<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词根词缀记单词 — 专升本高频词汇</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="记单词">
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>词根词缀记单词</h1>
        <p class="subtitle">专升本高频词汇 · 科学记忆法</p>
        <div class="global-stats">
            <span>总进度 <strong id="globalProgress">0%</strong></span>
            <span>已掌握 <strong id="globalMastered">0</strong></span>
        </div>
        <div class="global-progress-bar"><div id="globalProgressFill" class="global-progress-fill"></div></div>
    </header>

    <nav class="root-nav-wrapper">
        <div class="root-nav" id="rootNav"></div>
    </nav>

    <main>
        <!-- 学习面板 -->
        <div id="learnPanel">
            <div class="root-header" id="rootHeader"></div>
            <div class="word-cards" id="wordCards"></div>
        </div>

        <!-- 测验面板 -->
        <div id="quizPanel" class="hidden">
            <div class="quiz-setup">
                <h2>测验模式</h2>
                <div class="quiz-options">
                    <label>题目数量：<select id="quizCount">
                        <option value="10">10 题</option>
                        <option value="20" selected>20 题</option>
                        <option value="30">30 题</option>
                        <option value="50">50 题</option>
                    </select></label>
                    <label>题型：<select id="quizType">
                        <option value="meaning">看单词选释义</option>
                        <option value="word">看释义选单词</option>
                        <option value="root">看词根选单词</option>
                        <option value="mixed">混合模式</option>
                    </select></label>
                    <label>范围：<select id="quizScope">
                        <option value="all">全部单词</option>
                        <option value="current">当前词根</option>
                        <option value="unmastered">未掌握单词</option>
                    </select></label>
                </div>
                <button id="startQuiz" class="btn primary large">开始测验</button>
            </div>
            <div id="quizArea" class="quiz-area hidden">
                <div class="quiz-progress">
                    <span id="quizProgress"></span>
                    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
                </div>
                <div id="quizQuestion" class="quiz-question"></div>
                <div id="quizOptions" class="quiz-options-grid"></div>
                <div id="quizFeedback" class="quiz-feedback hidden"></div>
                <button id="quizNext" class="btn primary hidden">下一题</button>
            </div>
            <div id="quizResult" class="quiz-result hidden">
                <h2>测验结束</h2>
                <div class="result-score" id="resultScore"></div>
                <div id="resultWrong" class="result-wrong"></div>
                <button id="quizRetry" class="btn primary">再来一次</button>
            </div>
        </div>

        <!-- 搜索面板 -->
        <div id="searchPanel" class="hidden">
            <div class="toolbar">
                <input type="text" id="searchInput" placeholder="搜索单词、词根或中文含义…">
            </div>
            <div id="searchResults" class="word-cards"></div>
        </div>

        <!-- 复习面板 -->
        <div id="reviewPanel" class="hidden">
            <div class="review-header">
                <h2>📝 今日需复习</h2>
                <p class="review-subtitle" id="reviewSubtitle"></p>
            </div>
            <div id="reviewCards" class="word-cards"></div>
            <div id="reviewEmpty" class="hidden" style="text-align:center;padding:60px 20px;color:var(--text-muted);">
                <div style="font-size:48px;margin-bottom:16px;">🎉</div>
                <div style="font-size:16px;font-weight:600;">暂无需要复习的单词</div>
                <div style="font-size:13px;margin-top:8px;">点击学习中的"不认识"按钮，24小时后这里会出现复习提醒</div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="bnav active" data-panel="learnPanel">学习</button>
        <button class="bnav" data-panel="reviewPanel">
            复习
            <span class="review-badge hidden" id="reviewBadge">0</span>
        </button>
        <button class="bnav" data-panel="quizPanel">测验</button>
        <button class="bnav" data-panel="searchPanel">搜索</button>
    </nav>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
